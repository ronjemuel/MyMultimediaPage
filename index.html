<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Multimedia Page</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <h1>My Multimedia Page</h1>

    <!-- 1. PHOTOS SECTION -->
    <section class="section">
        <h2 class="section-header">Favourite Photo</h2>
        <div class="photos">
            <img src="nostalgic1.jpg" alt="A nostalic photo of  convenience store">
            <img src="nostalgic2.jpg" alt="A nostalic photo of  Carnival Park">
            <img src="nostalgic3.jpg" alt="Chill photo of Pepe">
            <img src="zeke.jpg" alt="A chill and cute Dog">
            <img src="manhwa.jpg" alt="My favorite manhwa scene">
        </div>
    </section>

    <!-- 2. MUSIC SECTION -->
    <section class="section">
        <h2 class="section-header">Music List</h2>
        <div class="music">
            
            <div class="track">
                <span class="track-name">1. Sweater Weather -
The Neighbourhood</span>
                <audio controls src="music/sweater-weather.mp3"></audio>
            </div>

            <div class="track">
                <span class="track-name">2. SYML - Where’s My Love</span>
                <audio controls src="music/wheresmylove.mp3"></audio>
            </div>

            <div class="track">
                <span class="track-name">3. Shiloh Dynasty - Solo For So Long</span>
                <audio controls src="music/soloforsolong.mp3"></audio>
            </div>

            <div class="track">
                <span class="track-name">4. Lonely God - Malburo Nights</span>
                <audio controls src="music/MarlboroNights-LonelyGod.mp3"></audio>
            </div>

            <div class="track">
                <span class="track-name">5. Shiloh Dynasty- Imagination </span>
                <audio controls src="music/Imagination-ShilohDynasty.mp3"></audio>
            </div>

        </div>
    </section>

    <!-- 3. VIDEO SECTION -->
    <section class="section">
        <h2 class="section-header">Dream Travel Destination</h2>
            <video controls src="video/video1.mp4"></video>
            <video controls src="video/video2.mp4"></video>
            <video controls src="video/video3.mp4"></video>
            <video controls src="video/video4.mp4"></video>
            <video controls src="video/video5.mp4"></video>
        </div>
    </section>

</body>
</html>
